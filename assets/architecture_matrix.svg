<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%">
  <defs>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0F17"/>
      <stop offset="100%" stop-color="#08090E"/>
    </linearGradient>
  </defs>

  <rect width="880" height="340" rx="10" fill="#050608"/>

  <!-- Card 1: Top Left -->
  <g transform="translate(16, 16)">
    <rect width="416" height="146" rx="8" fill="url(#card)" stroke="#262936" stroke-width="1.4"/>
    <line x1="0" y1="20" x2="0" y2="56" stroke="#D4AF37" stroke-width="3.5"/>
    <text x="22" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#F3F4F6">ZK &amp; L1/L2 Consensus</text>
    <text x="396" y="39" font-family="ui-monospace, Consolas, monospace" font-size="13.5" font-weight="700" fill="#D4AF37" text-anchor="end">RUST · WASM</text>
    <text x="22" y="76" font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#9CA3AF">• Ristretto255 &amp; Bulletproofs+ bounds</text>
    <text x="22" y="104" font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#9CA3AF">• WASM substate &amp; CBOR depth guards</text>
    <text x="22" y="132" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="600" fill="#6B7280">tari · tari-ootle · tari-crypto</text>
  </g>

  <!-- Card 2: Top Right -->
  <g transform="translate(448, 16)">
    <rect width="416" height="146" rx="8" fill="url(#card)" stroke="#262936" stroke-width="1.4"/>
    <line x1="0" y1="20" x2="0" y2="56" stroke="#D4AF37" stroke-width="3.5"/>
    <text x="22" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#F3F4F6">Compiler Static Analysis</text>
    <text x="396" y="39" font-family="ui-monospace, Consolas, monospace" font-size="13.5" font-weight="700" fill="#D4AF37" text-anchor="end">GO · SSA IR</text>
    <text x="22" y="76" font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#9CA3AF">• Slot-loan move checks across loops</text>
    <text x="22" y="104" font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#9CA3AF">• Closure escape &amp; alias verification</text>
    <text x="22" y="132" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="600" fill="#6B7280">limitlessprojects/Go-Hybrid (25+ PRs)</text>
  </g>

  <!-- Card 3: Bottom Left -->
  <g transform="translate(16, 178)">
    <rect width="416" height="146" rx="8" fill="url(#card)" stroke="#262936" stroke-width="1.4"/>
    <line x1="0" y1="20" x2="0" y2="56" stroke="#D4AF37" stroke-width="3.5"/>
    <text x="22" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#F3F4F6">EVM Hooks &amp; Calldata</text>
    <text x="396" y="39" font-family="ui-monospace, Consolas, monospace" font-size="13.5" font-weight="700" fill="#D4AF37" text-anchor="end">SOLIDITY</text>
    <text x="22" y="76" font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#9CA3AF">• Uniswap v4 ERC-4626 clamped exits</text>
    <text x="22" y="104" font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#9CA3AF">• Permit2 &amp; raw ABI static decoder</text>
    <text x="22" y="132" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="600" fill="#6B7280">v4lend · otc-taint-permit2-guard</text>
  </g>

  <!-- Card 4: Bottom Right -->
  <g transform="translate(448, 178)">
    <rect width="416" height="146" rx="8" fill="url(#card)" stroke="#262936" stroke-width="1.4"/>
    <line x1="0" y1="20" x2="0" y2="56" stroke="#D4AF37" stroke-width="3.5"/>
    <text x="22" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#F3F4F6">Acoustic DSP &amp; Codecs</text>
    <text x="396" y="39" font-family="ui-monospace, Consolas, monospace" font-size="13.5" font-weight="700" fill="#D4AF37" text-anchor="end">C++20 · TS</text>
    <text x="22" y="76" font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#9CA3AF">• Zero-disk Chromaprint stream dedup</text>
    <text x="22" y="104" font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#9CA3AF">• Blake2b-40 &amp; CUDA Cuckaroo29 solver</text>
    <text x="22" y="132" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="600" fill="#6B7280">fpcalc-stream-dedup · TARI.Miner</text>
  </g>
</svg>

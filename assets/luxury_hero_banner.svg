<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="45%" stop-color="#0B0C12"/>
      <stop offset="100%" stop-color="#060609"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A6B2E"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFF3C4"/>
      <stop offset="75%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#7A5C22"/>
    </linearGradient>
    <linearGradient id="goldVert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5E1A4" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#C5A059" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4A3815" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#594318" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="microGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D4AF37" stroke-width="0.4" stroke-opacity="0.08"/>
      <circle cx="40" cy="40" r="0.8" fill="#D4AF37" fill-opacity="0.18"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Obsidian Canvas -->
  <rect width="1200" height="380" rx="14" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" rx="14" fill="url(#microGrid)"/>
  <rect width="1200" height="380" rx="14" fill="url(#ambientGlow)"/>

  <!-- Luxury Double Hairline Frame -->
  <rect x="10" y="10" width="1180" height="360" rx="10" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.55"/>
  <rect x="18" y="18" width="1164" height="344" rx="7" fill="none" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.22"/>

  <!-- Corner Architectural Accents -->
  <path d="M 10 42 L 10 10 L 42 10" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <path d="M 1158 10 L 1190 10 L 1190 42" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <path d="M 10 338 L 10 370 L 42 370" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <path d="M 1158 370 L 1190 370 L 1190 338" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Left & Right Abstract Waveform / Cryptographic Ring Geometry -->
  <g opacity="0.25">
    <circle cx="150" cy="190" r="110" fill="none" stroke="url(#goldVert)" stroke-width="0.8" stroke-dasharray="6 4"/>
    <circle cx="150" cy="190" r="82" fill="none" stroke="#D4AF37" stroke-width="0.6"/>
    <polygon points="150,95 232,142 232,238 150,285 68,238 68,142" fill="none" stroke="#D4AF37" stroke-width="0.7" stroke-opacity="0.6"/>
    <line x1="40" y1="190" x2="260" y2="190" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.4"/>
    <line x1="150" y1="80" x2="150" y2="300" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.4"/>
  </g>

  <g opacity="0.25">
    <circle cx="1050" cy="190" r="110" fill="none" stroke="url(#goldVert)" stroke-width="0.8" stroke-dasharray="6 4"/>
    <circle cx="1050" cy="190" r="82" fill="none" stroke="#D4AF37" stroke-width="0.6"/>
    <polygon points="1050,95 1132,142 1132,238 1050,285 968,238 968,142" fill="none" stroke="#D4AF37" stroke-width="0.7" stroke-opacity="0.6"/>
    <line x1="940" y1="190" x2="1160" y2="190" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.4"/>
    <line x1="1050" y1="80" x2="1050" y2="300" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.4"/>
  </g>

  <!-- Top Telemetry Classification Bar -->
  <g font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10.5" fill="#9E8C66" letter-spacing="2.5">
    <text x="40" y="42">ARCHIVE // K4-S // SOVEREIGN SYSTEMS ARCHITECTURE</text>
    <text x="1160" y="42" text-anchor="end">OPSEC: ZERO-TRACE // STATE: VERIFIED</text>
  </g>
  <line x1="40" y1="52" x2="1160" y2="52" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.28"/>

  <!-- Center Crest Monogram -->
  <g transform="translate(600, 96)">
    <polygon points="0,-28 26,-14 26,14 0,28 -26,14 -26,-14" fill="#0B0C12" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <polygon points="0,-21 19,-10 19,10 0,21 -19,10 -19,-10" fill="none" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.5"/>
    <text x="0" y="5" font-family="'Cinzel', 'Times New Roman', serif" font-size="14" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">K4</text>
  </g>

  <!-- Main Luxury Title -->
  <text x="600" y="176" font-family="'Cinzel', 'Didot', 'Bodoni MT', 'Times New Roman', serif" font-size="44" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="14" filter="url(#softGlow)">
    KET4MIN · SUSAN
  </text>

  <!-- Subtitle Divider -->
  <line x1="340" y1="198" x2="860" y2="198" stroke="url(#goldGrad)" stroke-width="0.9" stroke-opacity="0.65"/>
  <circle cx="600" cy="198" r="3" fill="#FFF3C4"/>

  <!-- High-Tech Architectural Subtitle -->
  <text x="600" y="226" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="13" font-weight="500" fill="#E2D5B5" text-anchor="middle" letter-spacing="4.5">
    PROTOCOL, BINARY &amp; ACOUSTIC DSP SURGEON
  </text>

  <text x="600" y="254" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="11" fill="#8C8270" text-anchor="middle" letter-spacing="2">
    ZERO-KNOWLEDGE STATE MACHINES  ·  COMPILER OWNERSHIP VERIFICATION  ·  DEFI CALLDATA FORENSICS
  </text>

  <!-- Bottom Luxury Status Pills -->
  <g transform="translate(600, 304)" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" letter-spacing="1.8">
    <!-- Left Pill -->
    <rect x="-410" y="-16" width="250" height="28" rx="4" fill="#0E1017" stroke="#D4AF37" stroke-width="0.7" stroke-opacity="0.45"/>
    <circle cx="-392" cy="-2" r="3.2" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="-278" y="2" fill="#D5C7A3" text-anchor="middle">60+ UPSTREAM PATCHES</text>

    <!-- Center Pill -->
    <rect x="-135" y="-16" width="270" height="28" rx="4" fill="#0E1017" stroke="url(#goldGrad)" stroke-width="0.9" stroke-opacity="0.7"/>
    <text x="0" y="2" fill="#FFF3C4" text-anchor="middle">RUST · SOLIDITY · GO · C++20</text>

    <!-- Right Pill -->
    <rect x="160" y="-16" width="250" height="28" rx="4" fill="#0E1017" stroke="#D4AF37" stroke-width="0.7" stroke-opacity="0.45"/>
    <circle cx="178" cy="-2" r="3.2" fill="#D4AF37"/>
    <text x="292" y="2" fill="#D5C7A3" text-anchor="middle">ZERO-DISK DSP KERNELS</text>
  </g>

  <!-- Bottom Telemetry Bar -->
  <line x1="40" y1="336" x2="1160" y2="336" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.25"/>
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" fill="#6E6556" letter-spacing="2">
    <text x="40" y="354">FINGERPRINT // 0x7F4E · 9A1C · B802 · E47D [CANONICAL]</text>
    <text x="600" y="354" text-anchor="middle">INVARIANT: DETERMINISTIC MEMORY &amp; EXECUTION</text>
    <text x="1160" y="354" text-anchor="end">LATENCY // SUB-MILLISECOND</text>
  </g>
</svg>

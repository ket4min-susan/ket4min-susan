<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A0F"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059"/>
      <stop offset="50%" stop-color="#F5E1A4"/>
      <stop offset="100%" stop-color="#B38E46"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-width="0.4" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="880" height="230" rx="10" fill="url(#bg)"/>
  <rect width="880" height="230" rx="10" fill="url(#grid)"/>
  <rect x="1" y="1" width="878" height="228" rx="9" fill="none" stroke="#262936" stroke-width="1.5"/>
  <line x1="36" y1="1" x2="220" y2="1" stroke="url(#gold)" stroke-width="2.5"/>

  <!-- Main Handle (Huge, crisp, zero fluff) -->
  <text x="40" y="78" font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Consolas, monospace" font-size="46" font-weight="800" fill="#F3F4F6" letter-spacing="2">
    ket4min-susan
  </text>

  <!-- Core Stack Subtitle (Large 20px, scannable in 1 second) -->
  <text x="40" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="url(#gold)">
    Systems, Cryptography &amp; Compiler Engineering
  </text>

  <!-- 3 Concrete Focus Pills (16px bold text) -->
  <g transform="translate(40, 152)" font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="600">
    <rect x="0" y="0" width="235" height="42" rx="6" fill="#11131C" stroke="#2E3244" stroke-width="1.2"/>
    <text x="117" y="26" fill="#E5E7EB" text-anchor="middle">Rust · Go · Solidity</text>

    <rect x="252" y="0" width="265" height="42" rx="6" fill="#11131C" stroke="#2E3244" stroke-width="1.2"/>
    <text x="384" y="26" fill="#E5E7EB" text-anchor="middle">ZK &amp; L1/L2 Consensus</text>

    <rect x="534" y="0" width="265" height="42" rx="6" fill="#11131C" stroke="#2E3244" stroke-width="1.2"/>
    <text x="666" y="26" fill="#E5E7EB" text-anchor="middle">SSA &amp; Audio DSP</text>
  </g>
</svg>
